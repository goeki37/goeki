name: Build Goeki

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.8.9"
            gradle: "2.7"
          - mc: "1.7.10"
            gradle: "1.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Download Gradle ${{ matrix.gradle }}
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ matrix.gradle }}-bin.zip
          unzip -q gradle-${{ matrix.gradle }}-bin.zip
      - name: Fix 1.7.10 asset index
        if: matrix.mc == '1.7.10'
        run: |
          mkdir -p ~/.gradle/caches/minecraft/assets/indexes
          URL=$(curl -s https://launchermeta.mojang.com/mc/game/version_manifest.json | jq -r '.versions[] | select(.id=="1.7.10") | .url')
          AI=$(curl -s "$URL" | jq -r '.assetIndex.url')
          curl -s "$AI" -o ~/.gradle/caches/minecraft/assets/indexes/1.7.10.json
      - name: Build ${{ matrix.mc }}
        working-directory: forge-${{ matrix.mc }}
        run: |
          ../gradle-${{ matrix.gradle }}/bin/gradle --no-daemon setupDecompWorkspace
          ../gradle-${{ matrix.gradle }}/bin/gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: Goeki-${{ matrix.mc }}
          path: forge-${{ matrix.mc }}/build/libs/*.jar
